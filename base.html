<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DriveNow — аренда авто{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a href="/" class="logo">🚗 Drive<span>Now</span></a>
            <nav class="nav">
                <a href="{{ url_for('about') }}" class="{{ 'active' if active == 'about' }}">О нас</a>
                <a href="{{ url_for('fleet') }}" class="{{ 'active' if active == 'fleet' }}">Автопарк</a>
                <a href="{{ url_for('rules') }}" class="{{ 'active' if active == 'rules' }}">Правила аренды</a>
                <a href="{{ url_for('reviews') }}" class="{{ 'active' if active == 'reviews' }}">Отзывы</a>
                <a href="{{ url_for('contacts') }}" class="{{ 'active' if active == 'contacts' }}">Как добраться</a>
            </nav>
            <a href="tel:+70000000000" class="phone">+7 (000) 000-00-00</a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

<footer class="footer">
    <div class="container">
        <p>© 2026 DriveNow. Аренда автомобилей без лишних хлопот.</p>
        <p class="small">Фотографии автомобилей: Wikimedia Commons (свободные лицензии).</p>

        <div class="counters">
            <!--LiveInternet counter--><a href="https://www.liveinternet.ru/click"
            target="_blank"><img id="licnt5962" width="88" height="31" style="border:0"
            title="LiveInternet: показано число просмотров и посетителей за 24 часа"
            src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAEALAAAAAABAAEAAAIBTAA7"
            alt=""/></a><script>(function(d,s){d.getElementById("licnt5962").src=
            "https://counter.yadro.ru/hit?t52.6;r"+escape(d.referrer)+
            ((typeof(s)=="undefined")?"":";s"+s.width+"*"+s.height+"*"+
            (s.colorDepth?s.colorDepth:s.pixelDepth))+";u"+escape(d.URL)+
            ";h"+escape(d.title.substring(0,150))+";"+Math.random()})
            (document,screen)</script><!--/LiveInternet-->

            <!-- Top.Mail.Ru: видимый информер -->
            <!-- MyTracker (бывший Top.Mail.Ru): видимая кнопка -->
            <a href="https://tracker.my.com/" target="_blank" class="counter-badge counter-badge--mytracker"
               title="Статистика: MyTracker (Top.Mail.Ru)">
                <span class="counter-badge__logo">my</span>
                <span class="counter-badge__text">Tracker<small>статистика</small></span>
            </a>
            
            <!-- Top100 (СберАдс): видимая кнопка -->
            <a href="https://ads.sber.ru/" target="_blank" class="counter-badge counter-badge--top100"
               title="Статистика: Top100">
                <span class="counter-badge__logo">100</span>
                <span class="counter-badge__text">Top100<small>СберАдс</small></span>
            </a>
        </div>

        <!-- Top100 (Kraken) Counter: сбор статистики -->
        <script>
            (function (w, d, c) {
            (w[c] = w[c] || []).push(function() {
                var options = { project: 7753154 };
                try { w.top100Counter = new top100(options); } catch(e) { }
            });
            var n = d.getElementsByTagName("script")[0],
            s = d.createElement("script"),
            f = function () { n.parentNode.insertBefore(s, n); };
            s.type = "text/javascript";
            s.async = true;
            s.src = (d.location.protocol == "https:" ? "https:" : "http:") + "//st.top100.ru/top100/top100.js";
            if (w.opera == "[object Opera]") { d.addEventListener("DOMContentLoaded", f, false); } else { f(); }
            })(window, document, "_top100q");
        </script>
        <noscript><img src="//counter.rambler.ru/top100.cnt?pid=7753154" alt="Топ-100" /></noscript>

        <!-- Top.Mail.Ru counter: сбор статистики -->
        <script type="text/javascript">
        var _tmr = window._tmr || (window._tmr = []);
        _tmr.push({id: "3806751", type: "pageView", start: (new Date()).getTime()});
        (function (d, w, id) {
          if (d.getElementById(id)) return;
          var ts = d.createElement("script"); ts.type = "text/javascript"; ts.async = true; ts.id = id;
          ts.src = "https://top-fwz1.mail.ru/js/code.js";
          var f = function () {var s = d.getElementsByTagName("script")[0]; s.parentNode.insertBefore(ts, s);};
          if (w.opera == "[object Opera]") { d.addEventListener("DOMContentLoaded", f, false); } else { f(); }
        })(document, window, "tmr-code");
        </script>
        <noscript><div><img src="https://top-fwz1.mail.ru/counter?id=3806751;js=na" style="position:absolute;left:-9999px;" alt="Top.Mail.Ru" /></div></noscript>
    </div>
</footer>
</body>
</html>
